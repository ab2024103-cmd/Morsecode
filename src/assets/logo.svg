<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="28%" stop-color="#FACC15"/>
      <stop offset="62%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" ry="208" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" ry="208" fill="url(#sheen)"/>
  <rect x="80" y="80" width="864" height="864" rx="194" ry="194" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>

  <g fill="#FFFFFF">
    <!-- row 1: dot dot dash -->
    <rect x="214" y="386" width="112" height="112" rx="56"/>
    <rect x="366" y="386" width="112" height="112" rx="56"/>
    <rect x="518" y="386" width="292" height="112" rx="56"/>
    <!-- row 2: dash dot -->
    <rect x="290" y="546" width="292" height="112" rx="56"/>
    <rect x="622" y="546" width="112" height="112" rx="56"/>
  </g>
</svg>

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend (typecheck · build · smoke)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck + build
        shell: bash  # -eo pipefail, so `| tee` cannot mask a failure
        run: npm run build 2>&1 | tee -a ci.log

      - name: Headless smoke test (all screens, 4 themes, consent flow)
        shell: bash
        run: npm run smoke 2>&1 | tee -a ci.log

      # Log archives live on blob storage that is not always reachable, so
      # failures are echoed back onto the commit where they can be read via API.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(printf '### CI failure — frontend\n\n```\n%s\n```\n' "$(tail -n 120 ci.log)")
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$BODY" > /dev/null

  core:
    name: Rust core (check · clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKit/GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # dist/ is referenced by tauri.conf.json, so the frontend must exist.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build

      - name: cargo check
        shell: bash
        run: cargo check --all-targets --message-format short 2>&1 | tee -a ../ci.log
        working-directory: src-tauri

      - name: cargo clippy
        shell: bash
        run: cargo clippy --all-targets --message-format short 2>&1 | tee -a ../ci.log
        working-directory: src-tauri
        continue-on-error: true

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(printf '### CI failure — Rust core\n\n```\n%s\n```\n' "$(grep -E "^(error|warning: unused|src/)" ci.log | head -n 120)")
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$BODY" > /dev/null

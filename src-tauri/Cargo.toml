[package]
name = "morsecode"
version = "1.0.0"
description = "Peer-to-peer LAN file transfer. Local. Fast. No internet required."
authors = ["MorseCode"]
edition = "2021"
rust-version = "1.77"
default-run = "morsecode"

[lib]
name = "morsecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# LAN discovery: mDNS primary, raw UDP broadcast fallback.
mdns-sd = "0.11"
socket2 = { version = "0.5", features = ["all"] }
local-ip-address = "0.6"
gethostname = "0.5"

# Crypto: X25519 ECDH + HKDF-SHA256 + AES-256-GCM (ring, audited, tiny).
ring = "0.17"

# Integrity + identity
crc32fast = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

# Optional on-the-fly compression for compressible payloads.
zstd = "0.13"

# Persistence
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"

anyhow = "1"

[features]
# Ship the smallest possible binary by default.
default = []

[profile.release]
opt-level = "z"     # optimise for size — target is < 15 MB installed
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
